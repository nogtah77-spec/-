name: Apply Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY to apply pending migrations to the production Supabase database
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: inputs.confirmation == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing required GitHub Actions secret: SUPABASE_DB_URL" >&2
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
