kind = "web"
previewPath = "/"
title = "العمودي للتسويق العقاري"
version = "1.0.0"
id = "artifacts/alamoudi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20113

[services.development]
run = "pnpm --filter @workspace/alamoudi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alamoudi", "run", "build" ]
publicDir = "artifacts/alamoudi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20113"
BASE_PATH = "/"
